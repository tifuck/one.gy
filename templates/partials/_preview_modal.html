<!-- File Preview Modal -->
<div class="modal preview-modal" id="previewModal">
  <span class="preview-resolution" id="previewResolution"></span>
  <span class="preview-zoom-badge" id="previewZoomBadge"></span>
  <button class="preview-close" id="closePreviewModal">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M15 5L5 15M5 5l10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="preview-stage" id="previewBody">
    <div class="preview-loading">LOADING PREVIEW...</div>
  </div>
  <div class="preview-bar">
    <span class="preview-bar-name" id="previewFileName">PREVIEW</span>
    <a class="preview-bar-download" id="previewDownloadBtn" title="DOWNLOAD">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </a>
  </div>
</div>
