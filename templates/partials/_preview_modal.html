<!-- File Preview Modal -->
<div class="modal preview-modal" id="previewModal">
  <div class="preview-top">
    <button class="preview-close" id="closePreviewModal" aria-label="Close" title="Close (Esc)">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M15 5L5 15M5 5l10 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="preview-title">
      <span class="preview-bar-name" id="previewFileName">Preview</span>
      <span class="preview-meta"><span id="previewCount"></span><span class="preview-resolution" id="previewResolution"></span></span>
    </div>
    <div class="preview-actions" id="previewActions"></div>
    <a class="preview-bar-download" id="previewDownloadBtn" title="Download" aria-label="Download">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </a>
  </div>
  <div class="preview-stage" id="previewBody">
    <div class="preview-loading">Loading preview…</div>
  </div>
  <span class="preview-zoom-badge" id="previewZoomBadge"></span>
  <button class="preview-nav preview-nav-prev" id="previewPrev" aria-label="Previous image" title="Previous (←)" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <button class="preview-nav preview-nav-next" id="previewNext" aria-label="Next image" title="Next (→)" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <div class="preview-strip" id="previewStrip" hidden></div>
</div>
