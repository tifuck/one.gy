# electron-builder config for ONE.GY Desktop. Build through scripts/dist.js:
# it sets the version from client/VERSION (-c.extraMetadata.version), always
# passes --publish never (CI uploads the installers), and builds each Linux
# target in its own run (concurrent deb/rpm targets race on the shared
# resources/package-type file that electron-updater reads) and merges their
# latest-linux.yml / beta-linux.yml. The generic publish entry is only there
# so the builder writes those update files and app-update.yml (updater.js).
appId: gy.one.desktop
productName: ONE.GY Desktop
copyright: Copyright © ONE.GY
directories:
  output: dist
  buildResources: build
files:
  - package.json
  - src/**/*
  - "!**/*.map"
extraResources:
  - from: resources/engine
    to: engine
    filter:
      - "onegy"
      - "onegy.exe"
asar: true
publish:
  provider: generic
  url: https://github.com/tifuck/one.gy/releases/latest/download
generateUpdatesFilesForAllChannels: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ONE.GY-Desktop-Setup.${ext}
nsis:
  # Adds the bundled onegy binary to the user PATH (removed on uninstall).
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ONE.GY
  uninstallDisplayName: ONE.GY

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  icon: build/icons
  category: Network
  syncDesktopName: true
  executableName: onegy-desktop
  # Display name only; productName stays so install/config paths don't move.
  desktop:
    entry:
      Name: ONE.GY
  synopsis: one.gy in a native window, with end-to-end encrypted folder sync
  maintainer: tifuck <173309113+tifuck@users.noreply.github.com>
  vendor: ONE.GY
  # Root updater for the deb / rpm installs (see build/linux/after-install.sh).
  extraResources:
    - from: build/linux/update-system.sh
      to: update-system.sh
appImage:
  artifactName: ONE.GY-Desktop-x86_64.${ext}
# deb and rpm install to /opt/ONE.GY Desktop with a desktop entry and icons;
# the builder's default dependencies apply, plus curl for update-system.sh.
# The install scripts are the builder's defaults plus the root update timer.
deb:
  artifactName: onegy-desktop_amd64.${ext}
  packageName: onegy-desktop
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
  fpm: ["--depends", "curl"]
rpm:
  artifactName: onegy-desktop.x86_64.${ext}
  packageName: onegy-desktop
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
  fpm: ["--depends", "curl"]
